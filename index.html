<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON 在线解析工具</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='1.5' y='1.5' width='21' height='21' rx='5' fill='%23337ab7'/%3E%3Ctext x='4.1' y='16.8' fill='white' font-family='monospace' font-size='12.5' font-weight='700'%3E%7B%7D%3C/text%3E%3C/svg%3E">
  <style>
    :root{--nav:#4b5168;--primary:#337ab7;--primary-dark:#286090;--bg:#f5f7fa;--border:#dfe4ea;--text:#263238;--muted:#6b7280;--success:#198754;--danger:#dc3545;}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif}
    .topbar{height:58px;background:var(--nav);border-bottom:3px solid transparent;display:flex;align-items:center;padding:0 24px;color:#fff}
    .brand{font-size:19px;font-weight:600;letter-spacing:.5px}.brand small{font-size:12px;font-weight:400;opacity:.75;margin-left:8px}
    .page{width:100%;max-width:none;margin:0;padding:0}
    .card{width:100%;height:calc(100vh - 120px);min-height:0;background:#fff;border:1px solid var(--border);border-left:0;border-right:0;border-radius:0;box-shadow:0 2px 8px rgba(30,45,65,.06);overflow:hidden}.workspace-shell{display:flex;height:100%;min-height:0}.workspace-main{flex:1;min-width:0;min-height:0}.panel{height:100%;padding:18px;display:flex;flex-direction:column}.section-heading{font-size:17px;font-weight:600;color:#374151;margin:0 0 13px}.section-heading span{font-size:12px;color:#9aa3af;font-weight:400;margin-left:8px}.section-divider{height:1px;background:var(--border);margin:24px 0}.tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1;min-height:0}.tool-grid>div:first-child,.result-wrap{display:flex;flex-direction:column;min-height:0}.field-title{display:flex;justify-content:space-between;align-items:center;margin:0 0 8px;font-weight:600;color:#374151}.hint{font-size:12px;color:#9aa3af;font-weight:400}
    .editor-shell{position:relative;width:100%;height:auto;min-height:0;flex:1;overflow:hidden;resize:vertical;border:1px solid #cfd6df;border-radius:3px;background:#fbfcfd}.editor-highlight,.editor-shell textarea{position:absolute;inset:0;margin:0;min-height:0;padding:13px 14px;border:0;font:13px/1.6 Consolas,"SFMono-Regular","Courier New",monospace;tab-size:2}.editor-highlight{width:auto;height:auto;overflow:auto;scrollbar-width:none;background:#fbfcfd;color:#17202a;pointer-events:none;white-space:pre;word-break:normal}.editor-highlight::-webkit-scrollbar{display:none}.editor-shell textarea{width:100%;height:100%;resize:none;background:transparent;color:transparent;caret-color:#17202a;outline:none;transition:box-shadow .15s;white-space:pre;overflow:auto}.editor-shell textarea::selection{background:rgba(51,122,183,.25);color:transparent}.editor-shell textarea::placeholder{color:#9aa3af}.editor-shell:focus-within{border-color:#76a9d5;box-shadow:0 0 0 3px rgba(51,122,183,.12)}.editor-key{color:#9c6500}.editor-string{color:#087f23}.editor-number{color:#c2185b}.editor-boolean{color:#7b1fa2}.editor-null{color:#777}
    .actions{display:flex;flex-wrap:nowrap;gap:8px;margin:0 0 14px;overflow-x:auto;padding-bottom:2px}.btn{border:1px solid #cbd5df;background:#fff;color:#374151;border-radius:3px;padding:8px 15px;cursor:pointer;font-size:14px;transition:.15s;white-space:nowrap}.btn:hover{background:#f3f6f9}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.primary:hover{background:var(--primary-dark);border-color:var(--primary-dark)}.btn.success{background:#198754;border-color:#198754;color:#fff}.btn.danger{color:#b42318;border-color:#efb1ab}.btn:active{transform:translateY(1px)}
    .status{min-height:24px;margin-top:11px;padding:0 2px;color:var(--muted)}.status.ok{color:var(--success)}.status.error{color:var(--danger)}.status::before{content:""}.selection-status{text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.result-wrap{position:relative}.result-wrap .field-title{justify-content:space-between}.result-title,.input-title{display:inline-flex;align-items:center}.copy-icon{display:inline-flex;align-items:center;justify-content:center;width:25px;height:25px;margin-left:3px;padding:0;border:0;border-radius:3px;background:transparent;color:#6b7280;cursor:pointer;vertical-align:middle}.copy-icon:hover{background:#eef3f8;color:var(--primary)}.copy-icon svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.8}.tree-action{height:25px;margin-left:6px;padding:2px 8px;border:1px solid #d8e0e8;border-radius:3px;background:#fff;color:#5e6c7b;cursor:pointer;font-size:12px;font-weight:400}.tree-action:hover{border-color:#82add3;background:#f1f7fc;color:var(--primary)}.tree-action:disabled{cursor:not-allowed;border-color:#e7ebef;background:#f7f8fa;color:#b6bec8}.json-tree{height:auto;min-height:0;flex:1;max-height:none;overflow:auto;border:1px solid #cfd6df;border-radius:3px;background:#fff;padding:12px 14px;font:13px/1.65 Consolas,"SFMono-Regular","Courier New",monospace;white-space:normal;word-break:break-word}.tree-empty{display:flex;align-items:center;justify-content:center;height:100%;min-height:120px;color:#9aa3af;text-align:center}.tree-node{margin:2px 0}.tree-node summary{display:flex;align-items:center;gap:5px;list-style:none;cursor:pointer;outline:none}.tree-node summary::-webkit-details-marker{display:none}.tree-node summary::before{content:'▶';display:inline-block;width:12px;color:#7b8794;font-size:10px;transition:transform .15s}.tree-node[open]>summary::before{transform:rotate(90deg)}.tree-summary-key,.tree-key{color:#9c6500}.tree-node summary .tree-key{flex:0 1 auto;min-width:0;max-width:calc(100% - 4rem);white-space:normal;overflow-wrap:anywhere}.tree-row .tree-key{flex:0 1 auto;min-width:0;max-width:45%;white-space:normal;overflow-wrap:anywhere}.tree-summary-type{flex:0 0 auto;color:#6b7280;white-space:nowrap}.tree-children{margin:2px 0 2px 7px;padding-left:14px;border-left:1px solid #e6ebf0}.tree-row{display:flex;align-items:flex-start;gap:5px;min-width:0;min-height:23px}.tree-row .tree-separator{flex:0 0 auto}.tree-row .tree-string,.tree-row .tree-number,.tree-row .tree-boolean,.tree-row .tree-null{flex:1 1 auto;min-width:0;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}.tree-separator{color:#8b949e}.tree-string{color:#087f23}.tree-number{color:#c2185b}.tree-boolean{color:#7b1fa2}.tree-null{color:#777}.tree-root-label{color:#374151;font-weight:600}
    .footer{text-align:center;color:#9aa3af;font-size:12px;line-height:22px;margin:18px 0}.note{margin-top:18px;color:#6b7280;font-size:13px}.hidden{display:none!important}.history-toggle{margin-left:auto}.history-panel{width:0;overflow:hidden;background:#f8fafc;border-left:1px solid transparent;transition:width .2s ease}.history-panel.open{width:320px;border-left-color:var(--border)}.history-inner{width:320px;height:100%;padding:16px;display:flex;flex-direction:column}.history-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-weight:600;color:#374151}.history-list{overflow:auto;flex:1}.history-empty{color:#9aa3af;text-align:center;padding:28px 8px;font-size:13px}.history-item{position:relative;background:#fff;border:1px solid var(--border);border-radius:4px;padding:10px 38px 10px 10px;margin-bottom:8px;cursor:pointer;transition:.15s}.history-item:hover{border-color:#8bb5d9;box-shadow:0 2px 6px rgba(30,45,65,.08)}.history-time{font-size:12px;color:#6b7280;margin-bottom:5px}.history-preview{font:12px/1.45 Consolas,"SFMono-Regular","Courier New",monospace;color:#374151;white-space:pre-wrap;word-break:break-word;max-height:56px;overflow:hidden}.history-meta{font-size:11px;color:#9aa3af;margin-top:6px}.history-delete{position:absolute;right:8px;top:8px;width:24px;height:24px;padding:0;border:0;border-radius:3px;background:transparent;color:#9aa3af;cursor:pointer;font-size:16px;line-height:24px}.history-delete:hover{background:#fff0f0;color:#b42318}.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.42);display:flex;align-items:center;justify-content:center;z-index:20}.modal{width:min(420px,calc(100vw - 32px));background:#fff;border-radius:6px;box-shadow:0 14px 40px rgba(15,23,42,.25);padding:20px}.modal h3{margin:0 0 9px;font-size:17px}.modal p{margin:0 0 18px;color:#6b7280}.modal-actions{display:flex;justify-content:flex-end;gap:8px}.modal-actions .btn{min-width:74px}
    .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,10px);opacity:0;pointer-events:none;background:#263238;color:#fff;padding:10px 16px;border-radius:4px;box-shadow:0 4px 16px rgba(15,23,42,.2);transition:.2s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}.toast.success{background:#198754}.toast.error{background:#b42318}
    @media(max-width:780px){.card{height:auto;min-height:calc(100vh - 120px)}.workspace-shell{height:auto;min-height:calc(100vh - 120px)}.panel{height:auto;min-height:calc(100vh - 120px)}.tool-grid{grid-template-columns:1fr;flex:none}.topbar{padding:0 15px}.panel{padding:13px}.editor-shell,.json-tree{height:300px;min-height:260px;flex:none}.tabs{overflow:auto}.tab{white-space:nowrap}.history-panel.open{position:fixed;z-index:10;right:0;top:58px;bottom:0;width:min(320px,88vw);box-shadow:-6px 0 18px rgba(15,23,42,.12)}.history-inner{width:min(320px,88vw)}}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand">JSON 在线解析 <small>格式化 · 验证 · 转义</small></div></header>
  <main class="page">
    <section class="card">
      <div class="workspace-shell">
        <div class="workspace-main"><div class="panel">
          <div class="actions"><button class="btn primary" id="formatBtn">格式化</button><button class="btn" id="minifyBtn">压缩</button><button class="btn" id="validateBtn">验证</button><button class="btn" id="escapeBtn">转义 JSON</button><button class="btn" id="unescapeBtn">去除转义</button><button class="btn" id="saveBtn">保存</button><button class="btn danger" id="clearJsonBtn">清空</button><button class="btn history-toggle" id="historyToggleBtn">历史 JSON</button></div>
          <div class="tool-grid">
            <div><div class="field-title"><span class="input-title">JSON工作区<button class="copy-icon" id="copyInputBtn" type="button" title="复制 JSON 工作区内容" aria-label="复制 JSON 工作区内容"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="1"></rect><path d="M15 9V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h4"></path></svg></button></span><span class="hint">支持普通 JSON、数组或已转义字符串</span></div><div class="editor-shell"><pre class="editor-highlight" id="jsonHighlight" aria-hidden="true"></pre><textarea id="jsonInput" spellcheck="false" wrap="off" placeholder='请输入 JSON，例如：{"name":"张三","age":18}'>{"name":"张三","age":18,"skills":["HTML","JavaScript"]}</textarea></div><div id="jsonStatus" class="status" aria-live="polite"></div></div>
            <div class="result-wrap"><div class="field-title"><span class="result-title">JSON树<button class="tree-action" id="expandTreeBtn" type="button">展开</button><button class="tree-action" id="collapseTreeBtn" type="button">折叠</button></span><span class="hint">当前 JSON 可展开/折叠查看</span></div><div id="jsonResult" class="json-tree"><div class="tree-empty">请输入 JSON 以查看树形结构</div></div><div id="selectionStatus" class="status selection-status" aria-live="polite">未选择内容</div></div>
          </div>
        </div></div>
        <aside class="history-panel" id="historyPanel"><div class="history-inner"><div class="history-head"><span>历史 JSON</span><button class="btn" id="historyRefreshBtn">刷新</button></div><div class="history-list" id="historyList"><div class="history-empty">暂无历史记录</div></div></div></aside>
      </div>
    </section>
    <div class="footer">JSON 在线解析工具 · 牛牛</div>
  </main>
  <div class="modal-backdrop hidden" id="restoreModal" role="dialog" aria-modal="true"><div class="modal"><h3>当前工作区有内容</h3><p>恢复历史记录前，是否先保存当前输入和输出结果？</p><div class="modal-actions"><button class="btn" data-choice="cancel">取消</button><button class="btn" data-choice="discard">不保存</button><button class="btn primary" data-choice="save">保存</button></div></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    const $=id=>document.getElementById(id);
    const jsonInput=$('jsonInput'), jsonHighlight=$('jsonHighlight'), editorShell=jsonInput.parentElement, jsonResult=$('jsonResult'), jsonStatus=$('jsonStatus');
    let historyRecords=[]; let pendingRecord=null; let saving=false; let toastTimer=null; const historyStorageKey='json-format-history';
    function setStatus(el,msg,type=''){el.textContent=msg;el.className='status '+type}
    function escapeHighlightHtml(value){return String(value).replace(/[&<>]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[char]))}
    function syntaxHighlight(value){const escaped=escapeHighlightHtml(value);return escaped.replace(/("(?:\\.|[^"\\])*")(\s*:)?|\b(true|false|null)\b|(-?\b\d+(?:\.\d+)?(?:[eE][+-]?\d+)?\b)/g,(match,string,colon,literal,number)=>{if(string)return colon?'<span class="editor-key">'+string+'</span>'+colon:'<span class="editor-string">'+string+'</span>';if(literal)return literal==='null'?'<span class="editor-null">'+literal+'</span>':'<span class="editor-boolean">'+literal+'</span>';return '<span class="editor-number">'+number+'</span>'})}
    function syncEditorViewport(){const verticalScrollbar=Math.max(0,jsonInput.offsetWidth-jsonInput.clientWidth);const horizontalScrollbar=Math.max(0,jsonInput.offsetHeight-jsonInput.clientHeight);jsonHighlight.style.right=verticalScrollbar+'px';jsonHighlight.style.bottom=horizontalScrollbar+'px';jsonHighlight.scrollTop=jsonInput.scrollTop;jsonHighlight.scrollLeft=jsonInput.scrollLeft}
    function updateEditorHighlight(){jsonHighlight.innerHTML=syntaxHighlight(jsonInput.value)||' ';syncEditorViewport()}
    function parse(){return JSON.parse(jsonInput.value)}
    function valueClass(value){if(value===null)return 'tree-null';if(typeof value==='string')return 'tree-string';if(typeof value==='number')return 'tree-number';if(typeof value==='boolean')return 'tree-boolean';return ''}
    function formatValue(value){return typeof value==='string'?JSON.stringify(value):String(value)}
    function appendLabel(target,label,isArray){if(label===null)return;const key=document.createElement('span');key.className='tree-key';key.textContent=isArray?'['+label+']':JSON.stringify(label);target.append(key);const separator=document.createElement('span');separator.className='tree-separator';separator.textContent=':';target.append(separator)}
    function createTreeNode(value,label=null,isRoot=false,labelIsArray=false){const isObject=value!==null&&typeof value==='object';if(!isObject){const row=document.createElement('div');row.className='tree-row';appendLabel(row,label,labelIsArray);const content=document.createElement('span');content.className=valueClass(value);content.textContent=formatValue(value);row.append(content);return row}const isArray=Array.isArray(value);const entries=Object.entries(value);const details=document.createElement('details');details.className='tree-node';details.open=true;const summary=document.createElement('summary');if(isRoot){const root=document.createElement('span');root.className='tree-root-label';root.textContent='根节点';summary.append(root)}else appendLabel(summary,label,labelIsArray);const type=document.createElement('span');type.className='tree-summary-type';type.textContent=isArray?'['+entries.length+']':'{'+entries.length+'}';summary.append(type);details.append(summary);const children=document.createElement('div');children.className='tree-children';entries.forEach(([key,child])=>children.append(createTreeNode(child,key,false,isArray)));details.append(children);return details}
    function renderTree(data){jsonResult.replaceChildren(createTreeNode(data,null,true))}
    function renderTreeMessage(message){jsonResult.replaceChildren();const empty=document.createElement('div');empty.className='tree-empty';empty.textContent=message;jsonResult.append(empty)}
    function setTreeActionState(enabled){$('expandTreeBtn').disabled=!enabled;$('collapseTreeBtn').disabled=!enabled}
    function updateSelectionStats(){const start=jsonInput.selectionStart;const end=jsonInput.selectionEnd;const selected=jsonInput.value.slice(start,end);const status=$('selectionStatus');if(!selected){status.textContent='未选择内容';status.className='status selection-status';return}const lineCount=selected.split(/\r\n|\r|\n/).length;const length=selected.replace(/\s/g,'').length;status.textContent='已选择 '+lineCount+' 行，长度 '+length;status.className='status selection-status ok'}
    function updateTree(){const raw=jsonInput.value.trim();updateEditorHighlight();if(!raw){setTreeActionState(false);renderTreeMessage('请输入 JSON 以查看树形结构');return false}try{const data=JSON.parse(raw);if(data===null||typeof data!=='object'){setTreeActionState(false);renderTreeMessage('当前输入不是 JSON 对象或数组，无法生成树形结构');return false}setTreeActionState(true);renderTree(data);return true}catch(e){setTreeActionState(false);renderTreeMessage('当前输入不是有效 JSON，无法生成树形结构');return false}}
    function setEditorValue(text){jsonInput.value=text;jsonInput.scrollLeft=0;jsonHighlight.scrollLeft=0;updateTree();requestAnimationFrame(()=>{jsonInput.scrollLeft=0;jsonHighlight.scrollLeft=0})}
    function format(){try{const data=parse();const pretty=JSON.stringify(data,null,2);setEditorValue(pretty);setStatus(jsonStatus,'JSON 格式正确，已格式化到输入框','ok')}catch(e){updateTree();setStatus(jsonStatus,'JSON 格式错误：'+e.message,'error')}}
    function minify(){try{const data=parse();const compact=JSON.stringify(data);setEditorValue(compact);setStatus(jsonStatus,'压缩完成，结果已写入输入框','ok')}catch(e){updateTree();setStatus(jsonStatus,'JSON 格式错误：'+e.message,'error')}}
    function validate(){try{parse();updateTree();setStatus(jsonStatus,'JSON 格式正确，可以正常解析','ok')}catch(e){updateTree();setStatus(jsonStatus,'JSON 格式错误：'+e.message,'error')}}
    async function copyText(text,el){if(!text){setStatus(el,'没有可复制的内容','error');return}try{await navigator.clipboard.writeText(text);setStatus(el,'已复制到剪贴板','ok')}catch(e){const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();setStatus(el,'已复制到剪贴板','ok')}}
    function currentRecord(){return {time:new Date().toISOString(),json:jsonInput.value}}
    function notify(msg,type='success'){const toast=$('toast');toast.textContent=msg;toast.className='toast '+type+' show';clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2600)}
    async function readRecords(){try{const records=JSON.parse(localStorage.getItem(historyStorageKey)||'[]');return Array.isArray(records)?records.filter(record=>record&&typeof record.json==='string'):[]}catch(e){return[]}}
    async function saveRecord(record=currentRecord(),silent=false){if(saving)return false;saving=true;const saveBtn=$('saveBtn');saveBtn.disabled=true;saveBtn.textContent='保存中…';try{historyRecords=[record,...historyRecords.filter(item=>item.json!==record.json)];localStorage.setItem(historyStorageKey,JSON.stringify(historyRecords));renderHistory();if(!silent){setStatus(jsonStatus,'保存成功，已保存到浏览器','ok');notify('保存成功，已保存到浏览器','success')}return true}catch(e){if(!silent){setStatus(jsonStatus,'保存失败：'+e.message,'error');notify('保存失败：'+e.message,'error')}return false}finally{saving=false;saveBtn.disabled=false;saveBtn.textContent='保存'}}
    function shortText(text){return (text||'').replace(/\s+/g,' ').slice(0,110)||'（空内容）'}
    function renderHistory(){const list=$('historyList');if(!historyRecords.length){list.innerHTML='<div class="history-empty">暂无历史记录</div>';return}list.innerHTML=historyRecords.map((r,i)=>{const time=new Date(r.time);const label=Number.isNaN(time.getTime())?r.time:time.toLocaleString('zh-CN');return '<div class="history-item" data-index="'+i+'"><button class="history-delete" type="button" title="删除历史记录" aria-label="删除历史记录" data-delete-index="'+i+'">×</button><div class="history-time">'+label+'</div><div class="history-preview">'+escapeHtml(shortText(r.json))+'</div></div>'}).join('');list.querySelectorAll('.history-item').forEach(item=>item.onclick=()=>restoreHistory(historyRecords[Number(item.dataset.index)]));list.querySelectorAll('.history-delete').forEach(button=>button.onclick=event=>{event.stopPropagation();deleteHistory(Number(button.dataset.deleteIndex))})}
    function deleteHistory(index){if(index<0||index>=historyRecords.length)return;historyRecords.splice(index,1);localStorage.setItem(historyStorageKey,JSON.stringify(historyRecords));renderHistory();notify('历史记录已删除','success')}
    function escapeHtml(text){return String(text).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    async function loadHistory(){historyRecords=await readRecords();renderHistory()}
    function hasWorkspaceContent(){return Boolean(jsonInput.value.trim())}
    function isWorkspaceSaved(){return historyRecords.some(record=>record.json===jsonInput.value)}
    function restoreData(record){setEditorValue(record.json);setStatus(jsonStatus,'已恢复历史记录','ok')}
    function openRestoreModal(record){pendingRecord=record;$('restoreModal').classList.remove('hidden')}
    async function restoreHistory(record){if(hasWorkspaceContent()&&!isWorkspaceSaved()){openRestoreModal(record)}else restoreData(record)}
    $('restoreModal').querySelectorAll('[data-choice]').forEach(btn=>btn.onclick=async()=>{const choice=btn.dataset.choice;$('restoreModal').classList.add('hidden');if(choice==='cancel'){pendingRecord=null;return}const record=pendingRecord;pendingRecord=null;if(choice==='save'){const ok=await saveRecord(currentRecord());if(!ok)return}restoreData(record)});
    $('formatBtn').onclick=format;$('minifyBtn').onclick=minify;$('validateBtn').onclick=validate;$('clearJsonBtn').onclick=()=>{setEditorValue('');setStatus(jsonStatus,'')};$('copyInputBtn').onclick=()=>copyText(jsonInput.value,jsonStatus);$('saveBtn').onclick=()=>saveRecord();$('historyToggleBtn').onclick=async()=>{$('historyPanel').classList.toggle('open');if($('historyPanel').classList.contains('open'))await loadHistory()};$('historyRefreshBtn').onclick=loadHistory;
    $('expandTreeBtn').onclick=()=>{jsonResult.querySelectorAll('details.tree-node').forEach(node=>node.open=true)};$('collapseTreeBtn').onclick=()=>{jsonResult.querySelectorAll('details.tree-node').forEach(node=>node.open=false)};
    $('escapeBtn').onclick=()=>{const raw=jsonInput.value.trim();if(!raw){setStatus(jsonStatus,'请输入需要转义的内容','error');return}try{const data=JSON.parse(raw);setEditorValue(JSON.stringify(JSON.stringify(data)));setStatus(jsonStatus,'转义完成，结果已写入输入框','ok')}catch(e){setEditorValue(JSON.stringify(raw));setStatus(jsonStatus,'已按字符串进行转义，结果已写入输入框','ok')}};
    $('unescapeBtn').onclick=()=>{const raw=jsonInput.value.trim();if(!raw){setStatus(jsonStatus,'请输入需要去除转义的内容','error');return}try{let out=raw;for(let i=0;i<3;i++){const next=JSON.parse(out);if(typeof next!=='string'){out=JSON.stringify(next,null,2);break}out=next}setEditorValue(out);setStatus(jsonStatus,'去除转义完成，结果已写入输入框','ok')}catch(e){setEditorValue(raw.replace(/\\(["\\/bfnrt])/g,'$1').replace(/\\u([0-9a-fA-F]{4})/g,(_,h)=>String.fromCharCode(parseInt(h,16))));setStatus(jsonStatus,'已移除常见转义字符，结果已写入输入框','ok')}};
    jsonInput.addEventListener('input',()=>{updateTree();updateSelectionStats()});jsonInput.addEventListener('select',updateSelectionStats);jsonInput.addEventListener('keyup',updateSelectionStats);jsonInput.addEventListener('mouseup',updateSelectionStats);jsonInput.addEventListener('scroll',syncEditorViewport);if(window.ResizeObserver)new ResizeObserver(syncEditorViewport).observe(editorShell);document.addEventListener('selectionchange',()=>{if(document.activeElement===jsonInput)updateSelectionStats()});
    format();
    updateSelectionStats();
    loadHistory();
  </script>
</body>
</html>
